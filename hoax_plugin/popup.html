<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      width: 250px; 
      padding: 15px; 
      text-align: center; 
      background-color: #f8f9fa;
    }
    h3 { font-size: 14px; margin-top: 0; color: #333; }
    #server-status { 
      font-size: 11px; 
      font-weight: bold; 
      background: #ffffff; 
      padding: 6px; 
      border-radius: 4px; 
      border: 1px solid #e9ecef;
      margin-bottom: 8px;
    }
    p { font-size: 11px; color: #6c757d; margin: 0 0 12px 0; line-height: 1.4; }
    button { 
      width: 100%; 
      padding: 8px; 
      border: none; 
      border-radius: 4px; 
      font-size: 12px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .btn-disable { background-color: #ffe5e5; color: #d32f2f; border: 1px solid #ffcdd2; }
    .btn-disable:hover { background-color: #ffcdd2; }
    .btn-enable { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .btn-enable:hover { background-color: #c8e6c9; }
  </style>
</head>
<body>
  <h3>IndoBERT Hoax Detector</h3>
  
  <div id="server-status">CHECKING CONNECTION...</div>
  
  <p>Ekstensi otomatis melakukan penebakan keaslian headline berita secara real-time.</p>

  <button id="toggle-btn" class="btn-disable">MATIKAN DETEKTOR</button>

  <script src="popup.js"></script>
</body>
</html>
